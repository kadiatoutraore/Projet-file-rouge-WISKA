<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiska - Connexion & Accueil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body class="h-full bg-slate-900 text-white flex flex-col justify-between p-6">

    <header class="max-w-6xl mx-auto w-full flex justify-between items-center py-4">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center font-black text-2xl text-white shadow-lg shadow-blue-500/30">
                W
            </div>
            <span class="text-2xl font-extrabold tracking-tight text-blue-400">Wiska</span>
        </div>
        <span class="text-xs bg-slate-800 border border-slate-700 text-blue-400 px-3 py-1.5 rounded-full font-semibold">
            ● Plateforme Temps Réel Supabase
        </span>
    </header>

    <main class="max-w-md w-full mx-auto bg-slate-800/95 backdrop-blur-md border border-slate-700/80 rounded-3xl p-8 shadow-2xl space-y-6 my-auto">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold tracking-tight">Bienvenue sur Wiska</h1>
            <p class="text-xs text-slate-400">Messagerie instantanée, entraide et espace de formation</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Votre nom / Pseudo</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                    <input type="text" id="username-input" required placeholder="Ex: Kadiatou Traoré" class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Email</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                    <input type="email" id="email-input" required placeholder="kadiatou@wiska.app" class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Mot de passe</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                    <input type="password" id="password-input" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                </div>
            </div>
            <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/20 transition flex items-center justify-center space-x-2">
                <span>Accéder à la messagerie</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="relative flex py-1 items-center">
            <div class="flex-grow border-t border-slate-700"></div>
            <span class="flex-shrink mx-3 text-xs text-slate-500 uppercase font-semibold">ou</span>
            <div class="flex-grow border-t border-slate-700"></div>
        </div>

        <button type="button" id="btn-guest" class="w-full py-3 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded-xl text-sm transition flex items-center justify-center space-x-2 border border-slate-600">
            <i class="fa-solid fa-user-secret"></i>
            <span>Connexion Invité / Démo</span>
        </button>
    </main>

    <footer class="text-center text-xs text-slate-500 py-4">
        Wiska Platform © 2026 • Projet Fil-Rouge (8WEB101)
    </footer>

    <script src="index.js"></script>
</body>
</html>
