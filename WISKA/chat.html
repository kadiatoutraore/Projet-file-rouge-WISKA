<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiska - Messagerie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="chat.css">
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col overflow-hidden">

    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between z-30">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center font-black text-xl text-white shadow-md shadow-blue-500/20">
                W
            </div>
            <div>
                <h1 class="font-bold text-slate-100 text-sm leading-none">Wiska Messagerie</h1>
                <span class="text-[10px] text-blue-400 font-semibold uppercase tracking-wider">● En ligne</span>
            </div>
        </div>

        <nav class="flex space-x-2 bg-slate-800 p-1 rounded-xl">
            <a href="chat.html" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white shadow">
                <i class="fa-solid fa-comments mr-1"></i> Discussion
            </a>
            <a href="courses.html" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-graduation-cap mr-1"></i> Espace Cours & Quiz
            </a>
        </nav>

        <div class="flex items-center space-x-3">
            <img id="current-user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="w-8 h-8 rounded-full object-cover ring-2 ring-blue-500">
            <span id="current-user-name" class="text-xs font-bold text-slate-200 hidden sm:inline">Utilisateur</span>
            <button id="btn-logout" class="text-slate-400 hover:text-red-400 p-1.5 transition cursor-pointer" title="Déconnexion">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <aside class="w-80 bg-slate-900 border-r border-slate-800 flex flex-col h-full">
            <div class="flex border-b border-slate-800 text-xs font-bold">
                <button id="tab-btn-discussions" class="flex-1 py-3 px-2 text-center border-b-2 border-blue-500 text-blue-400 cursor-pointer">Discussions</button>
                <button id="tab-btn-contacts" class="flex-1 py-3 px-2 text-center text-slate-400 hover:text-slate-200 cursor-pointer">Contacts</button>
                <button id="tab-btn-settings" class="flex-1 py-3 px-2 text-center text-slate-400 hover:text-slate-200 cursor-pointer">Paramètres</button>
            </div>

            <!-- VUE DISCUSSIONS -->
            <div id="side-view-discussions" class="flex-1 overflow-y-auto divide-y divide-slate-800/60">
                <div data-target-id="room-general" data-target-name="# Général" data-target-status="Discussion publique de la classe" data-target-avatar="https://placehold.co/100/3b82f6/ffffff?text=#" class="chat-target-item p-3 hover:bg-slate-800/80 cursor-pointer flex items-center space-x-3 bg-slate-800/50 border-l-4 border-blue-500">
                    <div class="w-10 h-10 bg-blue-500/20 text-blue-400 rounded-full flex items-center justify-center font-bold">#</div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-xs sm:text-sm truncate"># Général</h4>
                        <p class="text-[11px] text-slate-400 truncate">Discussion publique</p>
                    </div>
                </div>
                <div data-target-id="room-cpp" data-target-name="# Entraide C++" data-target-status="Questions & débogage C++" data-target-avatar="https://placehold.co/100/6366f1/ffffff?text=C++" class="chat-target-item p-3 hover:bg-slate-800/80 cursor-pointer flex items-center space-x-3">
                    <div class="w-10 h-10 bg-indigo-500/20 text-indigo-400 rounded-full flex items-center justify-center font-bold">C++</div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-xs sm:text-sm truncate"># Entraide C++</h4>
                        <p class="text-[11px] text-slate-400 truncate">Débogage et code</p>
                    </div>
                </div>
            </div>

            <!-- VUE CONTACTS -->
            <div id="side-view-contacts" class="flex-1 overflow-y-auto flex flex-col hidden">
                <!-- Bouton Créer un contact -->
                <div class="p-3 border-b border-slate-800">
                    <button id="btn-open-create-contact" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-user-plus"></i>
                        <span>Créer un contact</span>
                    </button>
                </div>
                <!-- Liste dynamique des contacts -->
                <div id="contacts-list-container" class="flex-1 overflow-y-auto divide-y divide-slate-800/60">
                    <!-- Les contacts seront chargés dynamiquement via chat.js -->
                </div>
            </div>

            <!-- VUE PARAMÈTRES -->
            <div id="side-view-settings" class="p-4 space-y-4 hidden flex-1">
                <h3 class="font-bold text-sm text-slate-200 border-b border-slate-800 pb-2">Paramètres de profil</h3>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Modifier votre pseudo</label>
                    <input type="text" id="settings-username" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-xs text-white">
                </div>
                <button id="btn-save-settings" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold cursor-pointer">Enregistrer les modifications</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full bg-slate-950">
            <div class="px-4 py-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <img id="active-chat-avatar" src="https://placehold.co/100/3b82f6/ffffff?text=#" class="w-9 h-9 rounded-full object-cover">
                    <div>
                        <h3 id="active-chat-name" class="font-bold text-sm"># Général</h3>
                        <p id="active-chat-status" class="text-[11px] text-slate-400">Discussion publique de la classe</p>
                    </div>
                </div>
            </div>

            <div id="messages-box" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

            <div class="p-3 bg-slate-900 border-t border-slate-800 flex items-center space-x-2">
                <input type="text" id="message-text-input" placeholder="Écrivez un message..." class="flex-1 px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                <button id="btn-send-message" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-bold transition cursor-pointer">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- MODALE CRÉATION DE CONTACT -->
    <div id="modal-create-contact" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl max-w-xs w-full space-y-4">
            <h3 class="text-sm font-bold text-blue-400">Ajouter un nouveau contact</h3>
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">Nom du contact</label>
                <input type="text" id="new-contact-name" placeholder="Ex: Bademba, Abi..." class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500">
            </div>
            <div class="flex space-x-2">
                <button id="btn-cancel-contact" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold transition">Annuler</button>
                <button id="btn-save-contact" class="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition">Ajouter</button>
            </div>
        </div>
    </div>

    <script src="chat.js"></script>
</body>
</html>
